name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin lintian zip

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(make -s version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version-name $version in src/metadata.json"
            exit 1
          fi

      - name: Build
        run: make dist

      - name: Lint the package
        run: lintian --fail-on error,warning build/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: easyclip
          path: |
            build/*.deb
            build/*.zip
            build/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: easyclip
          path: build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The release notes are this version's section of the changelog.
          awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "EasyClip $version" --notes-file notes.md \
              build/*.deb build/*.zip build/SHA256SUMS
